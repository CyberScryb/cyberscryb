name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm ci
        working-directory: ./functions

      - name: Build React App (v2)
        run: |
          cd v2
          npm ci
          npm run build
          cd ..
          mkdir -p public/v2
          cp -r v2/dist/* public/v2/

      - name: Deploy Hosting + Functions
        run: firebase deploy --only hosting,functions --project gen-lang-client-0384486156 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-tests:
    name: JavaScript Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Jest resolves firebase-admin/firebase-functions via modulePaths → functions/node_modules,
      # so the functions deps must be installed too (or the ai-* suites fail to resolve the mocks).
      - run: npm ci
        working-directory: ./functions
      - run: npx jest --verbose --coverage
      - run: node scripts/seo-assert.js
      - run: node scripts/emit-tools-registry.js

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest feedparser requests beautifulsoup4
      - run: python -m pytest freelance-pipeline/tests/ -v

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-tests:
    name: JavaScript Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      # Cloud Functions deps (firebase-admin, firebase-functions, cors) install
      # into functions/node_modules. The ai-prompts and ai-generate-handler
      # suites require ../functions/index.js, which pulls these in, and the root
      # Jest config maps modulePaths to functions/node_modules. Without this the
      # two suites fail to load with "Cannot find module 'firebase-admin'".
      - run: npm ci
        working-directory: ./functions
      - run: npx jest --verbose --coverage

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest feedparser requests beautifulsoup4
      - run: python -m pytest freelance-pipeline/tests/ -v

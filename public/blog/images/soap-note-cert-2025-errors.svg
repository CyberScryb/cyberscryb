<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Why Medicare payments were ruled improper, 2025</title>
  <desc id="d">Bar chart of Medicare fee-for-service improper payments in the FY2025 CERT report, $28.83 billion in total. Insufficient documentation 53.0 percent, medical necessity 15.3 percent, no documentation 12.0 percent, incorrect coding 11.1 percent, other 8.5 percent. Insufficient and missing documentation together make up 65 percent.</desc>
  <rect width="960" height="440" rx="18" fill="#111114"/>
  <g font-family="Outfit, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#f4f4f5" font-size="24" font-weight="700">Most improper payments are a paperwork problem</text>
    <text x="40" y="80" fill="#a1a1aa" font-size="15">Share of $28.83B in Medicare fee-for-service improper payments, FY2025 CERT report</text>
    <text x="40" y="154" fill="#e4e4e7" font-size="17">Insufficient documentation</text>
    <rect x="300" y="130" width="520" height="36" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
    <text x="832" y="154" fill="#f4f4f5" font-size="17" font-weight="700">53.0%</text>
    <text x="40" y="206" fill="#e4e4e7" font-size="17">Medical necessity</text>
    <rect x="300" y="182" width="150" height="36" rx="6" fill="#71717a" fill-opacity="0.55"/>
    <text x="462" y="206" fill="#f4f4f5" font-size="17" font-weight="700">15.3%</text>
    <text x="40" y="258" fill="#e4e4e7" font-size="17">No documentation</text>
    <rect x="300" y="234" width="118" height="36" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
    <text x="430" y="258" fill="#f4f4f5" font-size="17" font-weight="700">12.0%</text>
    <text x="40" y="310" fill="#e4e4e7" font-size="17">Incorrect coding</text>
    <rect x="300" y="286" width="109" height="36" rx="6" fill="#71717a" fill-opacity="0.55"/>
    <text x="421" y="310" fill="#f4f4f5" font-size="17" font-weight="700">11.1%</text>
    <text x="40" y="362" fill="#e4e4e7" font-size="17">Other</text>
    <rect x="300" y="338" width="83" height="36" rx="6" fill="#71717a" fill-opacity="0.55"/>
    <text x="395" y="362" fill="#f4f4f5" font-size="17" font-weight="700">8.5%</text>
    <text x="40" y="414" fill="#fbbf24" font-size="15">Amber bars: records missing or not proving the service. Together, 65%.</text>
    <text x="920" y="414" fill="#71717a" font-size="12" text-anchor="end">Source: CMS 2025 supplemental improper payment data</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Workplace accommodation employer cost breakdown and EEOC interactive process steps</title>
  <desc id="d">Horizontal bar chart from the Job Accommodation Network (JAN) survey of employers showing that 56 percent of workplace accommodations cost $0, 37 percent involve a one-time cost with a median of $300, and 7 percent involve an ongoing or combined cost, paired with the four stages of the EEOC interactive process.</desc>
  <rect width="960" height="440" rx="18" fill="#111114"/>
  <g font-family="Outfit, Helvetica, Arial, sans-serif">
    <text x="40" y="50" fill="#f4f4f5" font-size="23" font-weight="700">Most ADA workplace accommodations cost employers $0</text>
    <text x="40" y="78" fill="#a1a1aa" font-size="15">Share of employer-reported accommodations by direct cost (Job Accommodation Network survey)</text>

    <text x="40" y="138" fill="#e4e4e7" font-size="16" font-weight="600">No direct cost ($0)</text>
    <text x="40" y="158" fill="#a1a1aa" font-size="13">Schedule flex, remote days, policy tweaks, reassigned marginal tasks</text>
    <rect x="430" y="124" width="410" height="36" rx="6" fill="#ef4444" fill-opacity="0.9"/>
    <text x="852" y="148" fill="#f4f4f5" font-size="17" font-weight="700">56%</text>

    <text x="40" y="206" fill="#e4e4e7" font-size="16" font-weight="600">One-time expenditure (median $300)</text>
    <text x="40" y="226" fill="#a1a1aa" font-size="13">Ergonomic hardware, screen readers, task lighting, acoustic headsets</text>
    <rect x="430" y="192" width="270" height="36" rx="6" fill="#f59e0b" fill-opacity="0.9"/>
    <text x="712" y="216" fill="#f4f4f5" font-size="17" font-weight="700">37%</text>

    <text x="40" y="274" fill="#e4e4e7" font-size="16" font-weight="600">Ongoing or annual cost</text>
    <text x="40" y="294" fill="#a1a1aa" font-size="13">Recurring interpreting services, software subscriptions, reader support</text>
    <rect x="430" y="260" width="52" height="36" rx="6" fill="#71717a" fill-opacity="0.65"/>
    <text x="494" y="284" fill="#f4f4f5" font-size="17" font-weight="700">7%</text>

    <line x1="40" y1="324" x2="920" y2="324" stroke="#27272a" stroke-width="1"/>
    <text x="40" y="352" fill="#f87171" font-size="14" font-weight="700">EEOC Interactive Process Scope (29 C.F.R. § 1630.2(o)(3)):</text>
    <rect x="40" y="366" width="205" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="54" y="390" fill="#e4e4e7" font-size="13" font-weight="600">1. Plain-English Trigger</text>
    <rect x="260" y="366" width="215" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="274" y="390" fill="#e4e4e7" font-size="13" font-weight="600">2. Functional Limitation</text>
    <rect x="490" y="366" width="210" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="504" y="390" fill="#e4e4e7" font-size="13" font-weight="600">3. Effective Adjustment</text>
    <rect x="715" y="366" width="205" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="729" y="390" fill="#e4e4e7" font-size="13" font-weight="600">4. Written Trial &amp; Review</text>

    <text x="920" y="424" fill="#71717a" font-size="12" text-anchor="end">Sources: DOL Job Accommodation Network (JAN) &amp; EEOC Enforcement Guidance No. 915.002</text>
  </g>
</svg>

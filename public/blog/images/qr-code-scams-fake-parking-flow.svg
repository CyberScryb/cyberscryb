<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How a fake parking QR code works, in four steps</title>
  <desc id="d">Step 1: a sticker with a QR code is pressed onto a parking meter. Step 2: the phone opens a lookalike address, paybyphone.citypark-pay.example. Step 3: a fake payment page asks for a card number. Step 4: a caller pretending to be the bank follows up.</desc>
  <rect width="960" height="400" rx="18" fill="#111114"/>
  <g font-family="Outfit, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#f4f4f5" font-size="24" font-weight="700">What a fake parking QR code does</text>
    <text x="40" y="80" fill="#a1a1aa" font-size="15">Based on city, police, and UK NCSC warnings published 2022 to 2026</text>
    <!-- step 1: meter -->
    <g transform="translate(40,110)">
      <rect width="200" height="250" rx="14" fill="#18181b" stroke="#3f3f46"/>
      <circle cx="28" cy="28" r="15" fill="#dc2626"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">1</text>
      <rect x="62" y="52" width="76" height="120" rx="10" fill="#27272a" stroke="#52525b"/>
      <rect x="72" y="62" width="56" height="22" rx="3" fill="#3f3f46"/>
      <g transform="translate(76,96) rotate(-4)">
        <rect width="50" height="56" rx="3" fill="#fafafa"/>
        <rect x="5" y="5" width="12" height="12" fill="#111"/><rect x="33" y="5" width="12" height="12" fill="#111"/><rect x="5" y="33" width="12" height="12" fill="#111"/>
        <rect x="22" y="22" width="6" height="6" fill="#111"/><rect x="34" y="34" width="6" height="6" fill="#111"/><rect x="24" y="36" width="4" height="8" fill="#111"/>
        <text x="25" y="53" fill="#111" font-size="6" text-anchor="middle">SCAN TO PAY</text>
      </g>
      <text x="100" y="205" fill="#f4f4f5" font-size="16" font-weight="600" text-anchor="middle">A sticker goes on</text>
      <text x="100" y="228" fill="#a1a1aa" font-size="13" text-anchor="middle">over or beside the</text>
      <text x="100" y="245" fill="#a1a1aa" font-size="13" text-anchor="middle">real instructions</text>
    </g>
    <path d="M248 235 h24" stroke="#a1a1aa" stroke-width="3" marker-end="url(#a)"/>
    <!-- step 2: phone url -->
    <g transform="translate(280,110)">
      <rect width="200" height="250" rx="14" fill="#18181b" stroke="#3f3f46"/>
      <circle cx="28" cy="28" r="15" fill="#dc2626"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">2</text>
      <rect x="55" y="45" width="90" height="140" rx="12" fill="#27272a" stroke="#52525b"/>
      <rect x="62" y="140" width="76" height="30" rx="6" fill="#facc15"/>
      <text x="100" y="152" fill="#111" font-size="7" text-anchor="middle">paybyphone.</text>
      <text x="100" y="163" fill="#111" font-size="7" font-weight="700" text-anchor="middle">citypark-pay.example</text>
      <text x="100" y="205" fill="#f4f4f5" font-size="16" font-weight="600" text-anchor="middle">A lookalike opens</text>
      <text x="100" y="228" fill="#a1a1aa" font-size="13" text-anchor="middle">brand on the left,</text>
      <text x="100" y="245" fill="#a1a1aa" font-size="13" text-anchor="middle">real owner on the right</text>
    </g>
    <path d="M488 235 h24" stroke="#a1a1aa" stroke-width="3" marker-end="url(#a)"/>
    <!-- step 3: card form -->
    <g transform="translate(520,110)">
      <rect width="200" height="250" rx="14" fill="#18181b" stroke="#3f3f46"/>
      <circle cx="28" cy="28" r="15" fill="#dc2626"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">3</text>
      <rect x="40" y="58" width="120" height="110" rx="10" fill="#27272a" stroke="#52525b"/>
      <text x="100" y="80" fill="#f4f4f5" font-size="11" font-weight="600" text-anchor="middle">Pay for parking</text>
      <rect x="52" y="92" width="96" height="16" rx="3" fill="#3f3f46"/><text x="58" y="104" fill="#d4d4d8" font-size="9">Card number</text>
      <rect x="52" y="114" width="44" height="16" rx="3" fill="#3f3f46"/><rect x="104" y="114" width="44" height="16" rx="3" fill="#3f3f46"/>
      <rect x="52" y="138" width="96" height="18" rx="9" fill="#dc2626"/><text x="100" y="151" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">PAY</text>
      <text x="100" y="205" fill="#f4f4f5" font-size="16" font-weight="600" text-anchor="middle">Your card is taken</text>
      <text x="100" y="228" fill="#a1a1aa" font-size="13" text-anchor="middle">a few dollars "paid,"</text>
      <text x="100" y="245" fill="#a1a1aa" font-size="13" text-anchor="middle">bigger charges later</text>
    </g>
    <path d="M728 235 h24" stroke="#a1a1aa" stroke-width="3" marker-end="url(#a)"/>
    <!-- step 4: call -->
    <g transform="translate(760,110)">
      <rect width="160" height="250" rx="14" fill="#18181b" stroke="#3f3f46"/>
      <circle cx="28" cy="28" r="15" fill="#dc2626"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">4</text>
      <rect x="45" y="60" width="70" height="110" rx="12" fill="#27272a" stroke="#52525b"/>
      <text x="80" y="100" fill="#f4f4f5" font-size="10" text-anchor="middle">Incoming call</text>
      <text x="80" y="116" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">"Your bank"</text>
      <circle cx="64" cy="148" r="9" fill="#dc2626"/><circle cx="96" cy="148" r="9" fill="#4ade80"/>
      <text x="80" y="205" fill="#f4f4f5" font-size="16" font-weight="600" text-anchor="middle">Sometimes</text>
      <text x="80" y="228" fill="#a1a1aa" font-size="13" text-anchor="middle">a fake bank call</text>
      <text x="80" y="245" fill="#a1a1aa" font-size="13" text-anchor="middle">keeps the con going</text>
    </g>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/></marker></defs>
</svg>

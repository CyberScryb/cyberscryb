      <text x="170" y="88" fill="#f4f4f5" font-size="14" font-family="Consolas, monospace">!</text>
      <text x="190" y="88" fill="#f87171" font-size="13">no match, back up</text>
      <rect x="24" y="101" width="98" height="22" rx="4" fill="#dc2626" opacity="0.22" stroke="#dc2626"/>

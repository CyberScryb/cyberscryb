      <text x="39.0" y="88" fill="#f4f4f5" font-size="14" text-anchor="middle" font-family="Consolas, monospace">a</text>
      <text x="73.0" y="88" fill="#f4f4f5" font-size="14" text-anchor="middle" font-family="Consolas, monospace">a</text>

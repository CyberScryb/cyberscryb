  <g font-family="Outfit, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#f4f4f5" font-size="24" font-weight="700">Why ^(a+)+$ explodes on an almost-match</text>
    <text x="40" y="80" fill="#a1a1aa" font-size="15">Step counts measured with PCRE2 10.46 (pcre2test find_limits), October 2026.</text>

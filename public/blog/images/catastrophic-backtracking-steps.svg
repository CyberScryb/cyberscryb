<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Catastrophic backtracking in ^(a+)+$: every split gets tried</title>
  <desc id="d">Left: the eight ways a backtracking engine can split the four a's in "aaaa!" between the inner and outer groups of (a+)+. Each one fails at the exclamation mark, so the engine must try all of them. Right: a log-scale bar chart of PCRE2 match steps for ^(a+)+$ on a's followed by "!": 80 steps at 5 characters, 2,560 at 10, 81,920 at 15 and 2,621,440 at 20. The fixed pattern ^a+$ needs 2 steps at every length.</desc>

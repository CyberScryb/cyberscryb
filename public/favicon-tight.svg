<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tight mascot icon — head + visor + wreath only.
       Optimized for favicon, social avatars, app icons.
       Renders cleanly at 16px, 32px, 64px, 128px. -->

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>

  <!-- Laurel wreath — left side, 4 leaves -->
  <!-- Bigger and more present than original to read at small sizes -->
  <ellipse cx="13" cy="20" rx="6" ry="2.8" transform="rotate(-50,13,20)" fill="#e03030"/>
  <ellipse cx="11" cy="27" rx="6" ry="2.8" transform="rotate(-60,11,27)" fill="#c41e1e"/>
  <ellipse cx="12" cy="34" rx="5.5" ry="2.6" transform="rotate(-70,12,34)" fill="#e03030"/>
  <ellipse cx="15" cy="41" rx="5" ry="2.4" transform="rotate(-80,15,41)" fill="#c41e1e"/>

  <!-- Wreath stem hint -->
  <path d="M10,42 Q15,30 16,18" fill="none" stroke="#8b1515" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Head — large enough to dominate at small sizes -->
  <rect x="18" y="14" width="36" height="34" rx="14" ry="14" fill="#f0ebe0"/>

  <!-- Visor — bold horizontal red band, the most recognizable element -->
  <rect x="22" y="22" width="28" height="12" rx="5" ry="5" fill="#c41e1e"/>

  <!-- Eyes -->
  <rect x="27" y="24.5" width="5" height="7" rx="2" ry="2" fill="#0a0a0a"/>
  <rect x="40" y="24.5" width="5" height="7" rx="2" ry="2" fill="#0a0a0a"/>

  <!-- Subtle eye highlights for life -->
  <rect x="28.5" y="25.5" width="1.5" height="1.5" rx="0.5" fill="#f0ebe0" opacity="0.8"/>
  <rect x="41.5" y="25.5" width="1.5" height="1.5" rx="0.5" fill="#f0ebe0" opacity="0.8"/>

  <!-- Smile -->
  <path d="M28,40 Q36,44 44,40" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round"/>
</svg>

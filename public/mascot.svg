<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="CyberScryb mascot — bot in toga with laurel wreath">
  <!-- Hero-sized CyberScryb mascot.
       Bot in white toga, red laurel wreath on head, red visor.
       Transparent background — sits cleanly on dark page bg.
       Scales without quality loss to any hero size. -->

  <!-- ============ Laurel wreath (left side of head) ============ -->
  <ellipse cx="48" cy="48" rx="14" ry="6" transform="rotate(-40,48,48)" fill="#e03030"/>
  <ellipse cx="38" cy="62" rx="15" ry="6.5" transform="rotate(-55,38,62)" fill="#c41e1e"/>
  <ellipse cx="34" cy="80" rx="14" ry="6" transform="rotate(-70,34,80)" fill="#e03030"/>
  <ellipse cx="36" cy="100" rx="13" ry="5.5" transform="rotate(-85,36,100)" fill="#c41e1e"/>
  <ellipse cx="44" cy="118" rx="11" ry="5" transform="rotate(-95,44,118)" fill="#e03030"/>
  <ellipse cx="56" cy="132" rx="9" ry="4" transform="rotate(-105,56,132)" fill="#c41e1e"/>

  <!-- Wreath stem hint -->
  <path d="M52,135 Q40,90 50,45" fill="none" stroke="#8b1515" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ============ Antenna ============ -->
  <line x1="120" y1="12" x2="120" y2="30" stroke="#f0ebe0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="9" r="6" fill="#c41e1e"/>

  <!-- ============ Head ============ -->
  <rect x="60" y="32" width="128" height="118" rx="48" ry="48" fill="#f0ebe0"/>

  <!-- ============ Visor (red horizontal band) ============ -->
  <rect x="72" y="68" width="104" height="40" rx="18" ry="18" fill="#c41e1e"/>

  <!-- ============ Eyes ============ -->
  <rect x="94" y="76" width="18" height="24" rx="6" ry="6" fill="#0a0a0a"/>
  <rect x="136" y="76" width="18" height="24" rx="6" ry="6" fill="#0a0a0a"/>

  <!-- Eye highlights -->
  <rect x="98" y="80" width="5" height="5" rx="1.5" fill="#f0ebe0" opacity="0.85"/>
  <rect x="140" y="80" width="5" height="5" rx="1.5" fill="#f0ebe0" opacity="0.85"/>

  <!-- ============ Smile ============ -->
  <path d="M96,128 Q124,144 152,128" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>

  <!-- ============ Toga / body ============ -->
  <path d="M64,148
           Q60,170 56,200
           Q60,235 80,255
           Q120,272 160,255
           Q180,235 184,200
           Q180,170 176,148
           Q140,165 120,160
           Q100,165 64,148 Z"
        fill="#f0ebe0"/>

  <!-- Toga fold accent (subtle red sash) -->
  <path d="M80,180 Q110,195 140,180 Q150,210 130,240 Q120,243 110,240 Q90,210 80,180 Z"
        fill="#e03030" opacity="0.18"/>

  <!-- Toga drape lines for depth -->
  <path d="M76,180 Q88,210 96,250" fill="none" stroke="#d4cfc4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M172,180 Q160,210 152,250" fill="none" stroke="#d4cfc4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M120,165 L120,250" fill="none" stroke="#d4cfc4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>

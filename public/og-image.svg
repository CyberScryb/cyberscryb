<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0066ff" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <!-- Ink glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.77  0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0.5 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.77  0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0.35 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial gradient for background vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0066ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#0066ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#vignette)" opacity="0.6"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle corner accents -->
  <path d="M 0 80 L 0 0 L 80 0" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 1120 0 L 1200 0 L 1200 80" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 0 550 L 0 630 L 80 630" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.2"/>
  <path d="M 1200 550 L 1200 630 L 1120 630" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.2"/>

  <!-- Background glow orb -->
  <circle cx="600" cy="280" r="220" fill="#0066ff" opacity="0.03"/>
  <circle cx="600" cy="280" r="140" fill="#0066ff" opacity="0.02"/>

  <!-- Logo icon (scaled up from favicon) -->
  <g transform="translate(510, 160)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#0a0a0a" stroke="#0066ff" stroke-width="3"/>
    <path d="M22 26h36M22 40h24M22 54h30" stroke="#0066ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "CyberScryb" title text -->
  <g filter="url(#textGlow)">
    <text x="600" y="320" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', 'Arial Black', sans-serif" font-size="72" font-weight="900" letter-spacing="6" fill="#0066ff">
      CyberScryb
    </text>
  </g>

  <!-- Accent line below title -->
  <rect x="350" y="345" width="500" height="2" fill="url(#accentLine)" rx="1"/>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="4" fill="#a0a0a0">
    Free, Privacy-First Developer Tools
  </text>

  <!-- URL at the bottom -->
  <text x="600" y="560" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#0066ff" opacity="0.5">
    cyberscryb.com
  </text>

  <!-- Thin border around the whole image -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#0066ff" stroke-width="1" opacity="0.15"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <style>
      .body { fill: #f0ebe0; }
      .visor { fill: #0066ff; }
      .eye { fill: #0a0a0a; }
      .leaf { fill: #0066ff; }
    </style>
  </defs>

  <!-- Antenna stick -->
  <line x1="120" y1="38" x2="120" y2="56" stroke="#f0ebe0" stroke-width="4" stroke-linecap="round"/>
  <!-- Antenna ball -->
  <circle cx="120" cy="30" r="8" fill="#0066ff"/>

  <!-- Laurel branch -->
  <g transform="translate(68, 72) rotate(-15)">
    <path d="M0,0 C-4,-8 -8,-18 -6,-32" fill="none" stroke="#0066ff" stroke-width="2.5"/>
    <ellipse cx="-4" cy="-2" rx="8" ry="4" transform="rotate(-55,-4,-2)" class="leaf"/>
    <ellipse cx="-9" cy="-10" rx="8" ry="4" transform="rotate(-45,-9,-10)" class="leaf"/>
    <ellipse cx="-12" cy="-19" rx="8" ry="4" transform="rotate(-35,-12,-19)" class="leaf"/>
    <ellipse cx="-11" cy="-27" rx="7" ry="3.5" transform="rotate(-25,-11,-27)" class="leaf"/>
    <ellipse cx="-8" cy="-34" rx="6" ry="3" transform="rotate(-15,-8,-34)" class="leaf"/>
  </g>

  <!-- Head shape - big rounded rectangle -->
  <rect x="62" y="54" width="116" height="95" rx="42" ry="42" class="body"/>

  <!-- Visor background -->
  <rect x="74" y="78" width="92" height="38" rx="18" ry="18" class="visor"/>

  <!-- Eyes - rounded rectangles -->
  <rect x="88" y="84" width="18" height="24" rx="7" ry="7" class="eye"/>
  <rect x="134" y="84" width="18" height="24" rx="7" ry="7" class="eye"/>

  <!-- Smile -->
  <path d="M107,128 Q120,137 133,128" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body/toga lines -->
  <path d="M78,158 Q95,168 120,162 Q145,156 162,164" fill="none" stroke="#f0ebe0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M85,170 Q102,180 125,174 Q148,168 168,176" fill="none" stroke="#f0ebe0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M92,182 Q110,190 130,185 Q150,180 170,186" fill="none" stroke="#f0ebe0" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Text: CYBERSCRYB -->
  <text x="120" y="228" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="2">
    <tspan fill="#0066ff">CYBER</tspan><tspan fill="#f0ebe0">SCRYB</tspan>
  </text>
</svg>
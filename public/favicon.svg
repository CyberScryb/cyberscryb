<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Antenna stick -->
  <line x1="16" y1="5" x2="16" y2="8" stroke="#f0ebe0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna ball -->
  <circle cx="16" cy="4" r="1.8" fill="#c41e1e"/>

  <!-- Laurel leaf hint -->
  <ellipse cx="9" cy="10" rx="2.5" ry="1.2" transform="rotate(-40,9,10)" fill="#c41e1e"/>
  <ellipse cx="8" cy="13" rx="2.5" ry="1.2" transform="rotate(-50,8,13)" fill="#c41e1e"/>

  <!-- Head -->
  <rect x="8" y="8" width="16" height="13" rx="6" ry="6" fill="#f0ebe0"/>

  <!-- Visor -->
  <rect x="10" y="11" width="12" height="5.5" rx="2.5" ry="2.5" fill="#c41e1e"/>

  <!-- Eyes -->
  <rect x="12" y="12" width="2.5" height="3.2" rx="1" ry="1" fill="#0a0a0a"/>
  <rect x="17.5" y="12" width="2.5" height="3.2" rx="1" ry="1" fill="#0a0a0a"/>

  <!-- Smile -->
  <path d="M14,19.5 Q16,21 18,19.5" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Body lines -->
  <path d="M10,23 Q16,26 22,23" fill="none" stroke="#f0ebe0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M11,25.5 Q16,28 21,25.5" fill="none" stroke="#f0ebe0" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>